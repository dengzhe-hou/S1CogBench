name: Deploy homepage

# Skipped while the repository is private. Pages starts once the repository is public
# and Pages is enabled with the GitHub Actions source.
on:
  push:
    branches: [main]
    paths:
      - 'homepage/**'
      - 'docs/*.md'
      - 'results/aggregate/**'
      - 'submissions/**'
      - 's1cogbench/community.py'
      - 's1cogbench/modes.py'
      - 's1cogbench/planning.py'
      - 'public_sources.json'
      - 'LICENSE'
      - 'scripts/build_homepage.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install markdown
      - run: python scripts/build_homepage.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage
      - id: deployment
        uses: actions/deploy-pages@v4
